[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filtered-fanout"
version = "0.1.0"
description = "One SNS topic, many filtered SQS consumers, each with its own dead-letter queue."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.170.0,<3",
    "constructs>=10.3.0,<11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
integration = [
    "boto3>=1.34",
    "testcontainers[localstack]>=4.8",
]
